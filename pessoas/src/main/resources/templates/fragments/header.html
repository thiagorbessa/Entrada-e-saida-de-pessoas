<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<header th:fragment="app-header">
    <nav>
        <ul class="nav-links">
            <li><a th:href="@{/}"> Início </a></li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/pessoas}"> Fluxo de Entrada e Saída </a>
            </li>

            <li sec:authorize="hasAnyRole('SISTEMA', 'GERAL')">
                <a th:href="@{/usuarios}"> Usuários </a>
            </li>

            <li sec:authorize="hasRole('ROLE_GERAL')">
                <a th:href="@{/auditoria/logs}">Logs de Auditoria</a>
            </li>

            <li sec:authorize="hasRole('ROLE_GERAL')">
                <a th:href="@{/auditoria/backup}">Backups</a>
            </li>
        </ul>

        <!-- Bloco do Usuário no Canto Direito -->
        <div class="nav-usuario" sec:authorize="isAuthenticated()"
             th:with="userObj=${usuarioLogado != null ? usuarioLogado : @usuarioRepository.findByCpf(#authentication.name).orElse(null)}">
            <a th:href="@{/}" class="link-usuario-logado" title="Ir para a página inicial">
                👤 <span th:text="${userObj != null ? userObj.nomeCompleto : #authentication.name}">Usuário</span>
            </a>
            <form th:action="@{/logout}" method="post" class="form-logout-inline">
                <button type="submit" class="btn-logout-link">Sair</button>
            </form>
        </div>
    </nav>
</header>
</body>
</html>
