<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<header th:fragment="app-header">
    <nav>
        <ul class="nav-links">
            <li><a th:href="@{/}"> Início </a></li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/pessoas}"> Fluxo de Entrada e Saída </a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/internacao}"> Internação </a>
            </li>

            <li sec:authorize="hasAnyRole('SISTEMA', 'GERAL')">
                <a th:href="@{/usuarios}"> Usuários </a>
            </li>

            <li sec:authorize="hasRole('ROLE_GERAL')">
                <a th:href="@{/auditoria/logs}">Logs de Auditoria</a>
            </li>

            <li sec:authorize="hasRole('ROLE_GERAL')">
                <a th:href="@{/auditoria/backup}">Backups</a>
            </li>
        </ul>

        <!-- Bloco do Usuário no Canto Direito -->
        <div class="nav-usuario" sec:authorize="isAuthenticated()"
             th:with="userObj=${usuarioLogado != null ? usuarioLogado : @usuarioRepository.findByCpf(#authentication.name).orElse(null)}">
            <a th:href="@{/}" class="link-usuario-logado" title="Ir para a página inicial">
                👤 <span th:text="${userObj != null ? userObj.nomeCompleto : #authentication.name}">Usuário</span>
            </a>
            <form th:action="@{/logout}" method="post" class="form-logout-inline">
                <button type="submit" class="btn-logout-link">Sair</button>
            </form>
        </div>
    </nav>

    <div th:if="${alertaMfa}" data-persist="true" class="alert alert-aviso" role="alert"
         style="margin: 12px auto 0 auto; max-width: 1440px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; text-align: center; font-weight: 600;">
        <span th:text="${alertaMfa}"></span>
        <a th:href="@{/2fa/configurar}" class="btn btn-salvar text-decoration-none"
           style="padding: 6px 14px; font-size: 0.88rem; color: #ffffff;">
            Configurar Agora
        </a>
        <button type="button" onclick="this.parentElement.remove()" aria-label="Fechar"
                style="background: none; border: none; font-size: 1.4rem; line-height: 1; color: #212529; cursor: pointer; padding: 0 4px;">
            &times;
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.alert').forEach(function (alerta) {
                if (alerta.dataset.persist === 'true') return;
                setTimeout(function () {
                    alerta.style.transition = 'opacity 0.3s ease';
                    alerta.style.opacity = '0';
                    setTimeout(function () {
                        alerta.remove();
                    }, 300);
                }, 10000);
            });
        });
    </script>
</header>
</body>
</html>
