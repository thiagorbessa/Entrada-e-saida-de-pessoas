<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo != null ? titulo : 'Erro no Sistema'}">Erro no Sistema</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>
<header>
    <nav>
        <ul class="nav-links">
            <li><a th:href="@{/}">Início</a></li>
            <a th:href="@{/pessoas}"> Fluxo de Entrada e Saída </a>
        </ul>
    </nav>
</header>

<main class="container-principal">
    <div class="card-welcome" style="max-width: 560px; margin: 40px auto; text-align: center;">
        <h1 class="welcome-title" th:text="${status != null ? 'Erro ' + status : 'Aviso'}">Erro</h1>
        <h3 style="margin-bottom: 12px; color: #2c3e50;"
            th:text="${titulo != null ? titulo : 'Não foi possível concluir a operação'}">Erro</h3>

        <div class="alert alert-erro" style="margin: 20px 0;">
            <p th:text="${mensagem != null ? mensagem : 'Ocorreu um erro inesperado no sistema.'}"></p>
        </div>

        <div class="welcome-actions" style="display: flex; gap: 10px; justify-content: center;">
            <a th:href="@{/pessoas}" class="btn btn-salvar text-decoration-none">Voltar para Listagem</a>
            <a th:href="@{/}" class="btn btn-limpar text-decoration-none">Página Inicial</a>
        </div>
    </div>

    <!-- Fragmento usado caso uma busca AJAX (/pessoas/buscar) falhe -->
    <div th:fragment="mensagemParcial" class="alert alert-erro" style="margin: 10px 0;">
        <span th:text="${erro}">Erro ao carregar dados.</span>
    </div>
</main>
</body>
</html>
