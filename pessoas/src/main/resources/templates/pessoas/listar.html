<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lista de Pessoas</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>

<body>
<header>
    <nav>
        <ul class="nav-links">
            <li><a th:href="@{/}"> Entrada e Saída </a></li>
            <li><a th:href="@{/pessoas}"> Listar </a></li>
            <li><a th:href="@{/pessoas/novo}"> Novo </a></li>
            <li sec:authorize="hasAnyRole('SISTEMA', 'GERAL')">
                <a th:href="@{/usuarios}"> Cadastro de Usuários </a>
            </li>
            <li sec:authorize="hasRole('ROLE_GERAL')">
                <a th:href="@{/auditoria/logs}">Logs de Auditoria</a>
            </li>
        </ul>

        <!-- Exibe o NOME COMPLETO do usuário autenticado -->
        <div class="nav-usuario" sec:authorize="isAuthenticated()">
            <a th:href="@{/}" class="link-usuario-logado" title="Ir para a página inicial">
                👤 <span th:text="${usuarioLogado != null ? usuarioLogado.nomeCompleto : #authentication.name}">Usuário</span>
            </a>
            <form th:action="@{/logout}" method="post" class="form-logout-inline">
                <button type="submit" class="btn-logout-link">Sair</button>
            </form>
        </div>
    </nav>
</header>

<main class="container-principal">
    <div class="card-tabela">

        <div class="titulo-secao">
            <h1>Lista de Pessoas</h1>
        </div>

        <!-- Mensagens de Feedback -->
        <div th:if="${sucesso}" class="alert alert-sucesso">
            <span th:text="${sucesso}"></span>
        </div>
        <div th:if="${erro}" class="alert alert-erro">
            <span th:text="${erro}"></span>
        </div>

        <!-- Campo de Pesquisa em Tempo Real Centralizado -->
        <div class="busca-container">
            <div class="busca-wrapper">
                <input type="text" id="busca" placeholder="Buscar por nome, CPF, RG ou telefone" autocomplete="off" />
                <a id="limpar-busca" href="javascript:void(0)">Limpar</a>
            </div>
        </div>

        <!-- Div de Rolagem Isolada para a Tabela -->
        <div class="tabela-responsiva">
            <table id="tabela-pessoas" th:fragment="tabela">
                <thead>
                <tr>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(0)">Documento ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(1)">Nome ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(2)">Telefone ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(3)">Unidade ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(4)">Setor ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(5)">Andar ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(6)">Paciente ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(7)">Hora Entrada ↕</button>
                    </th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(8)">Hora Saída ↕</button>
                    </th>
                    <th style="text-align: center;">Ação</th>
                    <th>
                        <button type="button" class="btn-ordenar" onclick="ordenarTabela(10)">Observação ↕</button>
                    </th>
                    <th style="text-align: center;">Histórico</th>
                    <th style="text-align: center;">Editar</th>
                    <th style="text-align: center;" sec:authorize="hasAnyRole('SISTEMA', 'GERAL')">Remover</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pessoas}">
                    <td th:text="${p.cpf != null && !p.cpf.isBlank() ? p.cpf : p.identidade}"></td>
                    <td class="font-weight-600" th:text="${p.nome}"></td>
                    <td th:text="${p.telefone}"></td>
                    <td th:text="${p.unidade}"></td>
                    <td th:text="${p.setor}"></td>
                    <td th:text="${p.andar}"></td>
                    <td th:text="${p.paciente}"></td>

                    <!-- Registro em Aberto -->
                    <th:block th:with="reg=${registrosAbertos != null ? registrosAbertos.get(p.id) : null}">
                        <td th:text="${reg != null ? #temporals.format(reg.dataHoraEntrada, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td th:text="${reg != null && reg.dataHoraSaida != null ? #temporals.format(reg.dataHoraSaida, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td style="text-align: center;">
                            <form th:if="${reg == null}" th:action="@{/registros/entrada}" method="post" style="display:inline;">
                                <input type="hidden" name="pessoaId" th:value="${p.id}" />
                                <button type="submit" class="btn-acao btn-entrada">Registrar Entrada</button>
                            </form>
                            <form th:if="${reg != null}" th:action="@{/registros/saida}" method="post" style="display:inline;">
                                <input type="hidden" name="registroId" th:value="${reg.id}" />
                                <button type="submit" class="btn-acao btn-saida">Registrar Saída</button>
                            </form>
                        </td>
                    </th:block>

                    <!-- Observação com texto expansível -->
                    <td class="td-obs">
                        <span th:text="${p.observacao != null and #strings.length(p.observacao) > 30 ? #strings.substring(p.observacao, 0, 30) + '...' : p.observacao}"></span>
                        <a href="javascript:void(0)" class="ver-mais" th:if="${p.observacao != null and #strings.length(p.observacao) > 30}"
                           th:data-obs="${p.observacao}" onclick="mostrarObservacaoCompleta(this)">Ver mais</a>
                    </td>

                    <!-- Ações -->
                    <td style="text-align: center;">
                        <a th:href="@{/pessoas/{id}/historico(id=${p.id})}" class="link-acao">Histórico</a>
                    </td>
                    <td style="text-align: center;">
                        <a th:href="@{/pessoas/{id}/editar(id=${p.id})}" class="link-acao">Editar</a>
                    </td>
                    <td style="text-align: center;" sec:authorize="hasAnyRole('SISTEMA', 'GERAL')">
                        <form th:action="@{/pessoas/{id}(id=${p.id})}" th:method="delete" style="display: inline;"
                              onsubmit="return confirm('Tem certeza de que deseja remover permanentemente este cadastro?');">
                            <button type="submit" class="btn-acao btn-remover">Remover</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pessoas == null || #lists.isEmpty(pessoas)}">
                    <td colspan="14" style="text-align: center; padding: 25px; color: #6c757d;">
                        Nenhuma pessoa encontrada.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<script>
    const buscaInput = document.getElementById('busca');
    const btnLimpar = document.getElementById('limpar-busca');
    let timeoutBusca = null;

    if (buscaInput) {
        buscaInput.addEventListener('input', function() {
            clearTimeout(timeoutBusca);
            timeoutBusca = setTimeout(() => {
                const termo = buscaInput.value;
                fetch(`/pessoas/buscar?termo=${encodeURIComponent(termo)}`)
                    .then(response => response.text())
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const novaTabela = doc.querySelector('#tabela-pessoas');
                        if (novaTabela) {
                            document.querySelector('#tabela-pessoas').innerHTML = novaTabela.innerHTML;
                        }
                    });
            }, 300);
        });
    }

    if (btnLimpar) {
        btnLimpar.addEventListener('click', function() {
            buscaInput.value = '';
            fetch('/pessoas/buscar?termo=')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const novaTabela = doc.querySelector('#tabela-pessoas');
                    if (novaTabela) {
                        document.querySelector('#tabela-pessoas').innerHTML = novaTabela.innerHTML;
                    }
                });
        });
    }

    function mostrarObservacaoCompleta(elemento) {
        const obs = elemento.getAttribute('data-obs');
        alert("Observação completa:\n\n" + obs);
    }

    let direcaoAsc = true;
    function ordenarTabela(colunaIndex) {
        const table = document.getElementById("tabela-pessoas");
        const tbody = table.querySelector("tbody");
        const linhas = Array.from(tbody.querySelectorAll("tr"));

        if (linhas.length <= 1) return;

        linhas.sort((a, b) => {
            const tdA = a.children[colunaIndex];
            const tdB = b.children[colunaIndex];

            if (!tdA || !tdB) return 0;

            const valA = tdA.innerText.trim().toLowerCase();
            const valB = tdB.innerText.trim().toLowerCase();

            return direcaoAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });

        direcaoAsc = !direcaoAsc;
        linhas.forEach(linha => tbody.appendChild(linha));
    }
</script>
</body>
</html>
