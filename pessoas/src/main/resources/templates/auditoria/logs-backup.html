<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Logs Arquivados do Ano</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>

<div th:replace="fragments/header :: app-header"></div>

<main class="container-principal">
    <div class="card-tabela">
        <div class="titulo-secao" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <h1 style="margin: 0; border: 0; padding: 0;" th:text="'Logs Arquivados do Ano: ' + ${ano}"></h1>
            <a th:href="@{/auditoria/backup(ano=${ano})}" class="btn btn-limpar">
                ← Voltar para Backups
            </a>
        </div>

        <div th:if="${logs == null or logs.isEmpty()}" class="alert alert-erro">
            Nenhum log de auditoria encontrado para o ano de <span th:text="${ano}"></span>.
        </div>

        <div th:if="${logs != null and !logs.isEmpty()}" class="tabela-responsiva">
            <table>
                <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>CPF Usuário</th>
                    <th>Nome Usuário</th>
                    <th>Ação</th>
                    <th>Entidade</th>
                    <th>Detalhes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td class="td-nowrap" th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td class="td-nowrap" th:text="${log.usuarioCpf}"></td>
                    <td class="font-weight-600" th:text="${log.usuarioNome}"></td>
                    <td class="font-weight-600" th:text="${log.acao}"></td>
                    <td th:text="${log.entidade}"></td>
                    <td style="text-align: left; font-family: monospace;" th:text="${log.detalhes}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
