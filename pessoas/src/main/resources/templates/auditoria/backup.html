<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Consulta de Backups de Auditoria</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
</head>
<body>
<header>
    <nav>
        <ul class="nav-links">
            <li><a th:href="@{/}">Início</a></li>
            <li><a th:href="@{/pessoas}">Listar Pessoas</a></li>
            <li><a th:href="@{/auditoria/logs}">Logs de Auditoria</a></li>
            <li><a th:href="@{/auditoria/backup}">Backup de Logs</a></li>
        </ul>
    </nav>
</header>

<main class="container-principal">
    <div class="card-welcome" style="max-width: 900px; margin: 30px auto;">
        <h1>Consulta de Logs Arquivados (Backup Anual)</h1>
        <p>Digite o ano correspondente ao backup que deseja consultar (Ex: 2025). Os dados exibidos são estritos de leitura.</p>

        <!-- Formulário de Pesquisa por Ano -->
        <form th:action="@{/auditoria/backup}" method="get" style="display: flex; gap: 10px; margin-top: 20px; margin-bottom: 15px;">
            <input type="number" name="ano" th:value="${anoPesquisado}" placeholder="Digite o ano (Ex: 2025)" required class="form-control" style="max-width: 250px;" />
            <button type="submit" class="btn btn-salvar">Pesquisar Backup</button>
        </form>

        <!-- Botões de Acesso aos Dados do Ano Pesquisado (Aparecem automaticamente após pesquisar um ano) -->
        <div th:if="${anoPesquisado != null}" style="margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap;">
            <!-- Botão de Pessoas -->
            <a th:href="@{/auditoria/backup/pessoas(ano=${anoPesquisado})}" class="btn" style="background-color: #2b7a78; color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 4px; font-weight: 600;">
                👥 Ver Pessoas do Ano de <span th:text="${anoPesquisado}"></span>
            </a>

            <!-- Botão de Logs do Ano (Redireciona para a página dedicada de logs) -->
            <a th:href="@{/auditoria/backup/logs-ano(ano=${anoPesquisado})}" class="btn" style="background-color: #2c7a7b; color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 4px; font-weight: 600;">
                📋 Ver Logs do Ano de <span th:text="${anoPesquisado}"></span>
            </a>
        </div>

        <!-- Mensagens de Erro ou Alerta -->
        <div th:if="${erro}" class="alert alert-erro">
            <p th:text="${erro}"></p>
        </div>
    </div>
</main>
</body>
</html>
